name: Update Google Scholar Citations

on:
  schedule:
    # Three staggered attempts per day (10:00, 18:00, and 02:00 China time).
    # Google Scholar may temporarily rate-limit cloud runners, so a later
    # attempt can refresh the snapshot without human intervention.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current Scholar data hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ] && [ -f assets/json/scholar.json ]; then
            sha_before=$(sha256sum _data/citations.yml assets/json/scholar.json | sha256sum | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          set +e
          status=1
          for attempt in 1 2; do
            start_time=$(date)
            echo "🚀 Citation update attempt $attempt/2..."
            timeout 180 python bin/update_scholar_citations.py
            status=$?
            end_time=$(date)
            if [ $status -eq 0 ]; then
              echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
              echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
              break
            fi
            echo "⚠️ Attempt $attempt failed with exit code $status."
            if [ $attempt -lt 2 ]; then sleep 45; fi
          done
          echo "status=$status" >> $GITHUB_OUTPUT
          set -e

      - name: Save new Scholar data hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ] && [ -f assets/json/scholar.json ]; then
            sha_after=$(sha256sum _data/citations.yml assets/json/scholar.json | sha256sum | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        run: |
          git add _data/citations.yml assets/json/scholar.json
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations"
            git push
          )

      - name: Mark failed refresh attempts
        if: steps.run_citation_update.outputs.status != '0'
        run: |
          echo "Google Scholar did not return a usable response after two attempts." >&2
          exit 1
