name: Sync Jiayi Ma publications

on:
  workflow_dispatch:
  schedule:
    - cron: "18 1 * * *" # 09:18 China Standard Time (UTC+8)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synchronise publications
        run: |
          python scripts/sync_publications.py --out work/publications.json
          python scripts/enrich_publications.py --file work/publications.json
          python scripts/discover_github_links.py --file work/publications.json --limit 25
          python scripts/sync_scholar.py --file work/publications.json
      - name: Update the static subsite source
        run: |
          mkdir -p jiayi-ma-source/data
          cp work/publications.json jiayi-ma-source/data/publications.json
      - name: Commit refreshed publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jiayi-ma-source/data/publications.json
          git diff --cached --quiet || git commit -m "Update Jiayi Ma publications and citations"
          git push
          gh workflow run deploy.yml --ref main
