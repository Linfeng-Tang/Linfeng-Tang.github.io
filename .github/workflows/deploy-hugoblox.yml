name: Deploy HugoBlox site

on:
  workflow_dispatch:
  push:
    branches:
      - hugoblox
    paths:
      - "hugoblox-site/**"
      - ".github/workflows/deploy-hugoblox.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-hugoblox"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: hugoblox-site

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.26.1
      HUGO_VERSION: 0.160.0
      NODE_VERSION: 24.14.1
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Cache Hugo modules
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugomod-${{ hashFiles('hugoblox-site/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo mod tidy
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Cache save
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            ~/go/pkg/mod
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: hugoblox-site/public

  deploy:
    if: github.ref == 'refs/heads/hugoblox' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
