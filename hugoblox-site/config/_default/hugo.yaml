baseURL: "https://linfeng-tang.github.io/"
title: "Linfeng Tang"
theme: []
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
removePathAccents: true
summaryLength: 30

pagination:
  pagerSize: 10

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON

permalinks:
  publication: "/publication/:slug/"
  post: "/news/:slug/"
  project: "/project/:slug/"
  page: "/:slug/"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types

module:
  imports:
    - path: github.com/HugoBlox/kit/modules/blox
    - path: github.com/HugoBlox/kit/modules/slides
    - path: github.com/HugoBlox/kit/modules/integrations/netlify
