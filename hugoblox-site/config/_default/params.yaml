hugoblox:
  schema: "2.0"

identity:
  name: "Linfeng Tang"
  organization: "Wuhan University"
  type: person
  tagline: "Computer Vision · Multi-modal Image Fusion · Low-light Enhancement"
  description: "Academic homepage of Linfeng Tang, Postdoctoral Researcher at Wuhan University working on multi-modal image fusion, restoration, and perception."
  social:
    twitter: ""

theme:
  mode: system
  pack: default
  colors:
    primary: "#c65d43"
    secondary: "#f0a38f"
    neutral: slate
  surfaces:
    background: "#fcf8f2"
    foreground: "#ffffff"

typography:
  pack: academic

layout:
  radius: lg
  spacing: comfortable
  avatar_shape: rounded

header:
  enable: true
  style: navbar
  sticky: true
  align: center
  search: true
  theme_toggle: true
  theme_picker: false
  language_switcher: true
  cta:
    enable: true
    text: "Google Scholar"
    url: "https://scholar.google.com/citations?user=PyRqpAsAAAAJ&hl=en"

footer:
  style: minimal
  language_switcher: true
  text: "Built with HugoBlox and customized for Linfeng Tang."

copyright:
  notice: "© {year} {name}. Built with HugoBlox."
  license:
    type: custom
    allow_derivatives: false
    share_alike: false
    allow_commercial: false

content:
  math:
    enable: false
  toc:
    enable: true
  reading_time:
    enable: true
  citations:
    style: apa

search:
  enable: true
  suggestions:
    - "Mask-DiFuser"
    - "ControlFusion"
    - "VideoFusion"
    - "SwinFusion"

repository:
  enable: true
  url: "https://github.com/Linfeng-Tang/Linfeng-Tang.github.io"
  branch: main
  content_dir: hugoblox-site/content

locale:
  date_format: "Jan 2, 2006"
  time_format: "3:04 PM"
  address_format: en-us
